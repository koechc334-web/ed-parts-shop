<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ikokitufiti.co.ke - Kenya Marketplace for Anything</title>
<link rel="stylesheet" href="./css/main.css">
</head>
<body>
<header>
  <h1>Ikokitufiti.co.ke</h1>
  <p>Kenya's open marketplace for anything - fashion, phones, electronics, farm, auto, home, etc.</p>
</header>

<!-- categories - real marketplace logic -->
<nav id="cats">
  <button data-c="all">All</button>
  <button data-c="fashion">Fashion</button>
  <button data-c="phones">Phones</button>
  <button data-c="electronics">Electronics</button>
  <button data-c="farm">Farm</button>
  <button data-c="auto">Auto</button>
  <button data-c="home">Home</button>
  <button data-c="etc">Etc</button>
</nav>

<div id="list"></div>

<script src="./js/services/storage.js"></script>
<script src="./js/services/validation.js"></script>
<script src="./js/app.js"></script>
<script>
// human fix: KE phone validation I added after M-Pesa failed 7pm
function isKEPhone(p){ return /^(07\d{8}|\+2547\d{8})$/.test(p); }
function esc(s){ let d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
</script>
</body>
</html>
