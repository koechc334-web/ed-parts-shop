<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}

.price{font-weight:bold;margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.price a{background:#22c55e;color:#fff;padding:5px 12px;border-radius:15px;text-decoration:none;font-size:12px}
.hide{display:none}
