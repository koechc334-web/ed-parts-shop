<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitufiti - Everything For Every Kenyan</title>
<style>
body{font-family:Arial;margin:0;background:#f7f7f7}
.header{background:#111;color:white;padding:14px 15px;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:24px;letter-spacing:-1px}
.banner{background:#FF6600;color:white;padding:14px;margin:10px;border-radius:16px}
.banner input{width:96%;padding:12px;border-radius:10px;border:none;margin-top:10px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px}
.cats button{padding:9px 18px;border-radius:22px;border:1px solid #ddd;background:white;white-space:nowrap;font-weight:bold}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;border-radius:14px;padding:10px}
.card img{width:100%;height:145px;object-fit:cover;border-radius:10px}
.btn{background:#111;color:white;padding:9px;border:none;border-radius:10px;width:100%;margin-top:6px}
</style>
</head>
<body>
<div class="header"><b>Kitufiti</b><span style="font-size:11px">🇰🇪 EVERYTHING • EVERYWHERE</span></div>

<div class="banner">
<b>🚚 KITUFITI - Countrywide Delivery</b><br>
Nairobi 199 | Mombasa, Kisumu, Eldoret, Nakuru 299 | Mashinani 349<br>
Lipa na M-Pesa Till: <span style="background:yellow;color:black;padding:2px 6px;border-radius:5px">YOUR TILL HERE</span><br>
<input id="search" placeholder="Search anything... TV, nguo, sufuria, makeup" onkeyup="doSearch()">
</div>

<div class="cats">
<button onclick="filterCat('All')">All</button>
<button onclick="filterCat('Electronics')">⚡ Electronics</button>
<button onclick="filterCat('Fashion')">👕 Fashion</button>
<button onclick="filterCat('Home')">🏠 Home</button>
<button onclick="filterCat('Beauty')">💄 Beauty</button>
<button onclick="filterCat('Kids')">🧒 Kids</button>
</div>

<div class="products" id="list"></div>

<script>
let products=[
{name:"32\" Smart TV",category:"Electronics",price:18500,img:"https://images.unsplash.com/photo-1593359677879-a4bb92f367d8"},
{name:"Bluetooth Speaker",category:"Electronics",price:2500,img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1"},
{name:"Fashion Dress",category:"Fashion",price:1800,img:"https://images.unsplash.com/photo-1515378791036-0648a3ef77b2"},
{name:"Sneakers",category:"Fashion",price:2800,img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"},
{name:"Sufuria Set",category:"Home",price:3200,img:"https://images.unsplash.com/photo-1585515656383-45a8c1dc9a2d"},
{name:"Bedsheets",category:"Home",price:2500,img:"https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af"},
{name:"Makeup Kit",category:"Beauty",price:1500,img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348"},
{name:"Kids Bag",category:"Kids",price:1400,img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62"},
];
let el=document.getElementById('list');
function show(arr){ el.innerHTML=""; arr.forEach(p=>{ el.innerHTML+=`<div class="card"><img src="${p.img}"><h4 style="margin:6px 0">${p.name}</h4><p>KES ${p.price}</p><button class="btn" onclick="buy('${p.name}')">Buy WhatsApp</button></div>`; }); }
function filterCat(c){ if(c=='All') show(products); else show(products.filter(p=>p.category==c)); }
function doSearch(){ let s=document.getElementById('search').value.toLowerCase(); show(products.filter(p=>p.name.toLowerCase().includes(s)||p.category.toLowerCase().includes(s))); }
function buy(n){ window.open("https://wa.me/254700000000?text=Habari Kitufiti, nataka "+n,"_blank"); }
show(products);
</script>
</body>
</html>
