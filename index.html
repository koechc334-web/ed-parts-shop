<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ikokitufiti.co.ke - Kenya Marketplace for Anything</title>
<style>
/* I kept css inline because external css folder broke on Render 2am */
body{font-family:system-ui,sans-serif;max-width:1100px;margin:auto;padding:16px;background:#fafafa}
header h1{margin:0}
#cats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
#cats button{padding:8px 14px;border:1px solid #ccc;border-radius:20px;background:#fff;cursor:pointer}
#cats button.active{background:#111;color:#fff}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:12px}
small{color:#666}
</style>
</head>
<body>
<header>
  <h1>Ikokitufiti.co.ke</h1>
  <p>Kenya's open marketplace for anything - fashion, phones, electronics, farm, auto, home, etc.</p>
</header>

<!-- categories - added etc because sellers kept asking for 'other' category -->
<nav id="cats">
  <button data-c="all" class="active" onclick="filterC('all',this)">All</button>
  <button data-c="fashion" onclick="filterC('fashion',this)">Fashion</button>
  <button data-c="phones" onclick="filterC('phones',this)">Phones</button>
  <button data-c="electronics" onclick="filterC('electronics',this)">Electronics</button>
  <button data-c="farm" onclick="filterC('farm',this)">Farm</button>
  <button data-c="auto" onclick="filterC('auto',this)">Auto</button>
  <button data-c="home" onclick="filterC('home',this)">Home</button>
  <button data-c="etc" onclick="filterC('etc',this)">Etc</button>
</nav>

<div id="list">Loading from Eldoret...</div>

<script>
// Eldoret M-Pesa check - 07... format
function isKEPhone(p){ return /^(07\d{8}|\+2547\d{8})$/.test(p.replace(/\s/g,'')) }
function esc(s){ let d=document.createElement('div'); d.textContent=s; return d.innerHTML }
  // CBD vs outskirts - boda rate 150-300
function getDeliveryFee(area){
  area=(area||'').toLowerCase();
  if(area.includes('cbd')||area.includes('town')) return 150;
  if(area.includes('chepkoilel')||area.includes('langas')||area.includes('kapsoya')) return 250;
  return 300;

let ALL=[];
  // low stock alert for shop owner
function lowStockAlert(qty){
  qty=parseInt(qty||0);
  if(qty===0) return 'Out of stock - order tomorrow';
  if(qty<5) return 'Low: '+qty+' left';
  return 'In stock';
}
async function load(){
 try{
  const r=await fetch('/api/products');
  ALL=await r.json();
  render(ALL);
 }catch(e){ document.getElementById('list').innerHTML='API offline - check Render logs'; }
}
function render(arr){
 const el=document.getElementById('list');
 if(!arr.length){ el.innerHTML='No products yet in this category.'; return; }
 el.innerHTML=arr.map(p=>`<div class=card><b>${esc(p.name)}</b><br><small>${esc(p.category)} | KES ${esc(String(p.price))}</small><br><small>${esc(p.description||'')}</small></div>`).join('');
}
function filterC(c,btn){
 document.querySelectorAll('#cats button').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
 if(c==='all') render(ALL); else render(ALL.filter(x=>x.category===c));
}
load();
</script>
</body>
</html>
