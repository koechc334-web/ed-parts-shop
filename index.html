<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ikokitufitii - Eldoret</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#000;color:#fff}
.card{background:#fff;margin:12px;padding:15px;border-radius:10px;box-shadow:0 2px 6px #ccc}
input{width:95%;padding:11px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
button{padding:10px 15px;background:#000;color:#fff;border:none;border-radius:6px;cursor:pointer}
#authModal{display:none;position:fixed;top:10%;left:5%;right:5%;background:#fff;padding:20px;border-radius:10px;z-index:99;box-shadow:0 10px 30px #0005}
.eye{cursor:pointer;position:absolute;right:15px;top:12px}
</style>
</head>
<body>

<div class="header">
  <b>Ikokitufitii 👟 Eldoret</b>
  <div><span id="userName"></span> <button onclick="openAuth()">Login / Create Account</button></div>
</div>

<div class="card" style="background:#fffbe6">All Shoes | Loafers | Sneakers | Heels - Delivery: CBD 200, Langas 350, Elgon View 400</div>

<div id="products"></div>

<div id="authModal">
  <h3>Create Account / Login</h3>
  <input id="authName" placeholder="Full Name (for create account)">
  <input id="authEmail" placeholder="Email *" type="email">
  <div style="position:relative"><input id="authPass" placeholder="Password *" type="password"><span class="eye" onclick="tog('authPass')">👁️</span></div>
  <p id="authMsg" style="color:red;font-size:13px"></p>
  <button onclick="register()">CREATE ACCOUNT</button>
  <button onclick="login()" style="background:#f68b1e">LOGIN</button>
  <p><a href="#" onclick="forgot()" style="color:#f68b1e">Forgot Password?</a></p>
  <button onclick="closeAuth()" style="background:#888">Close</button>
</div>

<script>
const API="https://ed-parts-shop.onrender.com";
function tog(id){const e=document.getElementById(id);e.type=e.type==='password'?'text':'password';}
function openAuth(){document.getElementById('authModal').style.display='block';}
function closeAuth(){document.getElementById('authModal').style.display='none';}

async function load(){
 const r=await fetch(API+'/api/products'); const data=await r.json();
 document.getElementById('products').innerHTML=data.map(p=>`
  <div class="card">
   <img src="${p.image}" style="width:100%;border-radius:8px">
   <h3>${p.name}</h3><p>KES ${p.price}</p>
   <p style="font-size:12px;color:#666">Delivery: CBD ${p.delivery.CBD} | Langas ${p.delivery.Langas}</p>
   <button onclick="buy('${p.name}')">Buy via WhatsApp</button>
  </div>`).join('');
}
load();
function buy(n){const u=localStorage.getItem('userName')||'Customer'; window.open(`https://wa.me/254700000000?text=Hi Ikokitufitii, I'm ${u}, I want ${n}`);}

async function register(){
 const res=await fetch(API+'/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:authName.value,email:authEmail.value,password:authPass.value})});
 const d=await res.json(); authMsg.innerText=d.message||d.error;
 if(d.message){localStorage.setItem('userName',d.name); userName.innerText=d.name;}
}
async function login(){
 const res=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:authEmail.value,password:authPass.value})});
 const d=await res.json(); authMsg.innerText=d.message||d.error;
 if(d.message){localStorage.setItem('userName',d.name); userName.innerText=d.name; closeAuth();}
}
async function forgot(){
 if(!authEmail.value){authMsg.innerText="Enter email first";return;}
 const res=await fetch(API+'/api/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:authEmail.value})});
 const d=await res.json(); alert(d.reset_link||d.message); authMsg.innerText=d.message;
}
userName.innerText=localStorage.getItem('userName')||'';
</script>
</body>
</html>
