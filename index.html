<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KenyaMart - Everything for Kenya</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.header{background:black;color:white;padding:15px;display:flex;justify-content:space-between}
.banner{background:#00a651;color:white;padding:15px;margin:10px;border-radius:15px}
.banner input{width:95%;padding:12px;border-radius:10px;border:none;margin-top:10px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px;white-space:nowrap}
.cats button{padding:8px 18px;border-radius:20px;border:1px solid #ccc;background:white}
.products{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:white;padding:10px;border-radius:12px;text-align:center}
.card img{width:100%;height:140px;object-fit:cover;border-radius:8px}
.btn{background:#00a651;color:white;padding:8px 12px;border:none;border-radius:8px;width:100%;margin-top:5px}
</style>
</head>
<body>
<div class="header">
<b>KenyaMart.co.ke</b>
<span>🇰🇪 All Kenya</span>
</div>

<div class="banner">
🚚 <b>DELIVERY COUNTRYWIDE - Nairobi 200, Mombasa Kisumu Eldoret 300, Other Towns 350</b><br>
Pay on Delivery • M-Pesa Till: 123456 - REPLACE WITH YOURS<br>
<input type="text" id="search" placeholder="Search for TV, Dress, Sofa, Makeup..." onkeyup="searchProducts()">
</div>

<div class="cats">
<button onclick="filterCat('All')">All</button>
<button onclick="filterCat('Electronics')">Electronics</button>
<button onclick="filterCat('Fashion')">Fashion</button>
<button onclick="filterCat('Home')">Home</button>
<button onclick="filterCat('Beauty')">Beauty</button>
<button onclick="filterCat('Kids')">Kids</button>
</div>

<div class="products" id="productList"></div>

<script>
let products = [
{name:"Samsung 32 TV", category:"Electronics", price:18500, img:"https://images.unsplash.com/photo-1593359677879-a4bb92f367d8"},
{name:"Bluetooth Speaker", category:"Electronics", price:2500, img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1"},
{name:"Fashion Dress", category:"Fashion", price:1800, img:"https://images.unsplash.com/photo-1515378791036-0648a3ef77b2"},
{name:"Men Sneakers", category:"Fashion", price:2800, img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"},
{name:"Sofa Cover Set", category:"Home", price:3500, img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7"},
{name:"Non-stick Sufuria", category:"Home", price:2200, img:"https://images.unsplash.com/photo-1585515656383-45a8c1dc9a2d"},
{name:"Makeup Kit", category:"Beauty", price:1500, img:"https://images.unsplash.com/photo-1596462502278-27bfdc403348"},
{name:"Kids Shoes", category:"Kids", price:1200, img:"https://images.unsplash.com/photo-1514989940723-e8e51635b782"},
];

let list = document.getElementById('productList');
function show(list2){
list.innerHTML="";
list2.forEach(p=>{
list.innerHTML+=`<div class="card"><img src="${p.img}"><h4>${p.name}</h4><p>KES ${p.price}</p><button class="btn" onclick="buy('${p.name}')">Buy via WhatsApp</button></div>`;
});
}
function filterCat(c){
if(c=='All') show(products);
else show(products.filter(p=>p.category==c));
}
function searchProducts(){
let s=document.getElementById('search').value.toLowerCase();
show(products.filter(p=>p.name.toLowerCase().includes(s) || p.category.toLowerCase().includes(s)));
}
function buy(name){
window.open("https://wa.me/254700000000?text=Hi, I want to buy "+name, "_blank");
}
show(products);
</script>
</body>
</html>
