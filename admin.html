<!DOCTYPE html><html><meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font-family:sans-serif;padding:15px;max-width:400px;margin:auto">
<h3>Ikokitufiti Admin</h3>
<form id="f">
<input id="n" placeholder="Name e.g Tecno Camon 20" required style="width:100%;padding:12px;margin:6px 0"><br>
<input id="p" type="number" placeholder="Price KES e.g 15000" required style="width:100%;padding:12px;margin:6px 0"><br>
<select id="c" style="width:100%;padding:12px"><option>phones</option><option>fashion</option><option>electronics</option><option>farm</option></select><br><br>
<input type="file" id="img" accept="image/*" capture="environment" required><br><br>
<img id="prev" style="width:100%;display:none"><br>
<button style="width:100%;padding:14px;background:green;color:white;border:0;border-radius:8px">POST</button>
<p id="s"></p>
</form>
<script>
img.onchange=()=>{prev.src=URL.createObjectURL(img.files[0]);prev.style.display='block'}
f.onsubmit=async(e)=>{e.preventDefault();let fd=new FormData();fd.append('name',n.value);fd.append('price',p.value);fd.append('category',c.value);fd.append('image',img.files[0]);s.textContent='Uploading...';let r=await fetch('https://ed-parts-shop.onrender.com/api/products',{method:'POST',body:fd});s.textContent=r.ok?'✅ Posted!':'❌ Failed '+r.status}
</script></body></html>
